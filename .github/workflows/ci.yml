name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build C binary
        working-directory: scratch-dna
        run: gcc -O2 -pthread -o scratch-dna-c scratch-dna.c

      - name: Go tests
        working-directory: scratch-dna
        run: go test -v -timeout 120s scratch-dna.go scratch-dna_test.go

      - name: C tests
        working-directory: scratch-dna
        run: bash test-scratch-dna-c.sh

      - name: Python tests
        working-directory: scratch-dna
        run: python3 -m unittest test_run_scratch_dna -v
